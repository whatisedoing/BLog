<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BeerLog">
<title>BeerLog</title>
<style>
:root{--oak:#17110d;--leather:#241a13;--leather2:#2f2218;--line:#4a3826;--brass:#d1a049;--claret:#8a2b3a;--claret2:#a63a4b;--parchment:#efe3cb;--muted:#a8977c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--oak);color:var(--parchment);font-family:Georgia,"Palatino Linotype",Palatino,serif;line-height:1.55}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 10px;border-bottom:3px double var(--brass);margin-bottom:18px}
h1{margin:0;font-size:1.7rem;font-style:italic;font-weight:normal;color:var(--brass)}
h2{font-size:1.15rem;font-weight:normal;font-style:italic;margin:26px 0 10px;color:var(--brass)}
section.card{background:var(--leather);border:1px solid var(--line);border-radius:6px;padding:16px}
label,.lbl{display:block;margin:12px 0 4px;color:var(--muted);font-size:.92rem}
input,select,textarea{width:100%;background:var(--oak);color:var(--parchment);border:1px solid var(--line);border-radius:4px;padding:10px;font:inherit;font-size:1rem}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:4px;padding:11px 16px;border:1px solid var(--brass);background:var(--claret);color:var(--parchment);width:100%;margin-top:16px;font-size:1.02rem}
button:hover{background:var(--claret2)}
button.quiet{background:none;color:var(--muted);border-color:var(--line);width:auto;margin:0;padding:6px 12px;font-size:.9rem}
button.quiet:hover{background:var(--leather2)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:10px;min-height:1.2em;font-size:.95rem}
.err{color:#e88b8b}.ok{color:#a8d39a}
.stars{font-size:1.5rem;background:linear-gradient(90deg,var(--brass) var(--p),#4a3b2c var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.rate{display:flex;align-items:center;gap:14px}
.rate .num{font-size:1.4rem;min-width:3ch;color:var(--brass)}
input[type=range]{padding:0;accent-color:var(--brass);height:32px;border:none;background:none}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.entry .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry .name{font-size:1.05rem}
.entry .sub,.entry .note{color:var(--muted);font-size:.9rem}
.entry .note{font-style:italic;margin-top:2px}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.hit{cursor:pointer}
.hit:hover{background:var(--leather2)}
.meta{color:var(--muted);font-size:.92rem}
.meta a{color:var(--brass)}
.avg{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.avg .stars{font-size:1.7rem}
.avg .big{font-size:2rem;color:var(--brass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
details{margin-top:12px;border:1px solid var(--line);border-radius:4px;padding:2px 12px 12px}
summary{cursor:pointer;color:var(--brass);padding:10px 0;font-style:italic}
.res .meta{padding:6px 0}
button.pick{text-align:left;margin:4px 0 0;background:var(--oak);border-color:var(--line);padding:8px 10px;font-size:.95rem}
button.pick:hover{background:var(--leather2);border-color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button.chip{width:auto;margin:0;padding:5px 12px;font-size:.92rem;background:var(--oak);border-color:var(--line);border-radius:999px;color:var(--muted)}
button.chip:hover{background:var(--leather2)}
button.chip.on,button.chip.on:hover{background:var(--brass);color:var(--oak);border-color:var(--brass)}
.btnrow{display:flex;gap:10px}
.btnrow button{flex:1;width:auto}
.btnrow button.quiet{padding:11px 16px;font-size:1.02rem}
.sug{border:1px solid var(--line);border-radius:4px;background:var(--oak);max-height:230px;overflow-y:auto;margin-top:4px}
button.opt{display:block;width:100%;text-align:left;margin:0;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:9px 10px;font-size:.95rem}
button.opt:last-child{border-bottom:none}
button.opt:hover{background:var(--leather2)}
button.opt small{display:block;color:var(--muted);font-size:.8rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.sv{flex:1;margin:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--oak);border-color:var(--line);color:var(--muted);font-size:.78rem;border-radius:6px}
button.sv:hover{background:var(--leather2)}
button.sv svg{fill:currentColor}
button.sv .ic{display:flex;align-items:center;height:34px}
button.sv.on,button.sv.on:hover{background:var(--brass);color:var(--oak);border-color:var(--brass)}
.tabs{display:flex;gap:8px;margin:-6px 0 14px}
button.tab{flex:1;margin:0;padding:8px;font-size:.95rem}
button.tab.on,button.tab.on:hover{background:var(--brass);color:var(--oak);border-color:var(--brass)}
.badge{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.badge:last-child{border-bottom:none}
.badge .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.badge .name{font-size:1.05rem}
.medal{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c,#4a3b2c);color:var(--c,#4a3b2c);background:var(--oak)}
.medal svg{width:24px;height:24px;fill:currentColor}
.bar{height:6px;background:#3a2c20;border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--brass)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,7,5,.93);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;overflow:auto}
.modal .panel{width:100%;max-width:520px;background:var(--leather);border:1px solid var(--brass);border-radius:6px;padding:16px}
#reader{width:100%;min-height:200px;background:#000;border-radius:4px;overflow:hidden}
.row{display:flex;gap:10px;align-items:stretch}
.row button{width:auto;margin-top:0;white-space:nowrap}
button.scan{margin-top:0}
.ph{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:4px;border:1px solid var(--line);margin-top:8px;cursor:zoom-in;background:var(--oak)}
.phprev{display:flex;gap:12px;align-items:center;margin-top:8px}
.phprev img{width:84px;height:84px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

/* ---------- wood wall + bottom tab bar ---------- */
body{background-image:
  repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 1px,rgba(255,255,255,.018) 1px 2px,transparent 2px 88px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 11px),
  linear-gradient(165deg,#271c14 0%,#1a120d 48%,#110c08 100%);
  background-attachment:fixed;background-repeat:no-repeat;background-size:cover;
  padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:4px;margin:0;
  background:rgba(18,13,9,.97);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
#nav .tab{flex:1;margin:0;padding:7px 2px 6px;border:none;background:none;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;
  font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase}
#nav .tab svg{width:22px;height:22px;fill:currentColor}
#nav .tab.on,#nav .tab.on:hover{color:var(--brass);background:rgba(209,160,73,.1)}
body.onhome header{justify-content:flex-end;border-bottom:none;margin-bottom:0;padding-bottom:0}
body.onhome header h1{display:none}
body.onhome #signout{border-color:transparent;padding:6px 0;font-size:.82rem}
/* ---------- home ---------- */
#home{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
body.onhome{overflow:hidden;padding-bottom:0}
body.onhome #home{min-height:0;overflow:hidden;
  height:calc(100vh - var(--chrome, 126px) - env(safe-area-inset-top));
  height:calc(100dvh - var(--chrome, 126px) - env(safe-area-inset-top))}
#home .sign{text-align:center;margin:clamp(2px,1.6dvh,18px) 0 0;position:relative}
#home .sign:before{content:"";position:absolute;left:50%;top:-70px;transform:translateX(-50%);
  width:420px;height:300px;pointer-events:none;
  background:radial-gradient(50% 44% at 50% 40%,rgba(74,170,125,.26),rgba(255,180,70,.08) 52%,transparent 74%)}
#home .frame{position:relative;display:inline-block;padding:7px;border-radius:19px;
  background:linear-gradient(168deg,#e8c88c,#8f6c31 45%,#d7b06a 72%,#7d5d28);
  box-shadow:0 14px 34px rgba(0,0,0,.66),0 0 72px rgba(60,150,110,.3)}
#home .panel{border-radius:13px;padding:clamp(11px,1.9dvh,16px) 24px clamp(10px,1.8dvh,15px);display:flex;align-items:center;gap:15px;
  background:radial-gradient(120% 150% at 50% 0%,#3f7a60,#255142 60%,#1b3b31);
  box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 0 30px rgba(74,170,125,.4)}
#home .panel svg{width:clamp(30px,4.6dvh,40px);height:clamp(42px,6.4dvh,56px);flex:none}
#home .wm{font-size:clamp(1.6rem,4.1dvh,2rem);font-weight:bold;letter-spacing:-.5px;color:#f6ecd6;line-height:1;
  text-shadow:0 0 14px rgba(255,240,200,.45)}
#home .wm em{font-style:italic;font-weight:normal;color:#e8c179}
#home .cap{margin-top:clamp(6px,1.4dvh,12px);font-size:.62rem;letter-spacing:3.4px;text-transform:uppercase;color:var(--muted);font-family:system-ui,sans-serif}
#home .ledger{display:flex;margin-top:clamp(10px,2.4dvh,22px);padding:clamp(10px,1.9dvh,17px) 0 clamp(9px,1.7dvh,15px);
  border-top:1px solid rgba(209,160,73,.26);border-bottom:1px solid rgba(209,160,73,.26)}
#home .lg{flex:1;text-align:center;position:relative}
#home .lg+.lg:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:rgba(209,160,73,.18)}
#home .lg b{display:block;font-size:clamp(1.45rem,3.3dvh,1.8rem);font-weight:normal;line-height:1.05;color:#e2b662}
#home .lg span{display:block;margin-top:4px;font-size:.6rem;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-family:system-ui,sans-serif}
#home .shelf{margin:auto 0}
#home .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
#home .sh .t{font-size:.63rem;letter-spacing:3.2px;text-transform:uppercase;color:var(--muted);font-family:system-ui,sans-serif}
#home button.link{width:auto;margin:0;padding:2px 0;border:none;background:none;color:var(--brass);
  font-size:.63rem;letter-spacing:2.4px;text-transform:uppercase;font-family:system-ui,sans-serif}
#home .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
#home .c{width:auto;min-width:0;margin:0;text-align:left;background:rgba(32,23,16,.78);border:1px solid rgba(209,160,73,.2);
  border-radius:13px;padding:7px 7px 10px;color:inherit;font-size:1rem}
#home .c:hover{background:rgba(44,32,22,.85);border-color:rgba(209,160,73,.45)}
#home .im{height:clamp(56px,12.2dvh,112px);border-radius:9px;overflow:hidden;position:relative;display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 3px,transparent 3px 7px),linear-gradient(160deg,#2c2118,#191209)}
#home .im img{width:100%;height:100%;object-fit:cover;display:block}
#home .im svg{width:62px;height:82px;opacity:.42}
#home .cn{margin-top:clamp(5px,1dvh,8px);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--parchment)}
#home .cm{font-size:.72rem;color:var(--brass);margin-top:2px;font-family:system-ui,sans-serif}
#home .cta{display:block;width:100%;margin-top:clamp(10px,2.2dvh,20px);border:none;border-radius:15px;padding:clamp(12px,2dvh,17px) 0;
  font-family:Georgia,"Palatino Linotype",Palatino,serif;font-weight:bold;font-size:1.16rem;letter-spacing:3px;text-transform:uppercase;
  color:#1b1209;background:linear-gradient(180deg,#e9bf6d,#c9933c);
  box-shadow:0 1px 0 rgba(255,255,255,.42) inset,0 -2px 0 rgba(0,0,0,.26) inset,0 10px 26px rgba(201,147,60,.26)}
#home .cta:hover{background:linear-gradient(180deg,#f0c87a,#d29c42)}
#home .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:clamp(7px,1.3dvh,10px)}
#home .pill{width:auto;min-width:0;margin:0;border:2px solid rgba(209,160,73,.8);border-radius:14px;
  background:linear-gradient(180deg,#36604e,#1f3a30);
  padding:11px 4px 10px;text-align:center;color:inherit;font-size:1rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.4)}
#home .pill:hover{background:linear-gradient(180deg,#3d6c58,#254437)}
#home .chip{width:30px;height:30px;margin:0 auto;border-radius:9px;display:grid;place-items:center;
  background:rgba(0,0,0,.2);border:1px solid rgba(232,193,121,.45);color:#f0dcb0}
#home .chip svg{width:17px;height:17px;fill:currentColor}
#home .pl{display:block;margin-top:7px;font-size:.64rem;letter-spacing:1.3px;text-transform:uppercase;color:#f3e7d0;font-family:system-ui,sans-serif}
#home .pn{display:block;font-size:.64rem;color:#a9c7b6;margin-top:2px;font-family:system-ui,sans-serif}
/* ---------- menu ---------- */
#menuBtn{width:auto;margin:0;padding:6px 8px;border-color:transparent;line-height:0}
#menuBtn svg{width:26px;height:26px;fill:var(--brass)}
#menu{position:fixed;z-index:8;top:calc(env(safe-area-inset-top) + 56px);right:12px;width:230px;
  background:var(--leather);border:1px solid var(--brass);border-radius:8px;padding:6px;
  box-shadow:0 14px 34px rgba(0,0,0,.6)}
#menu button{display:block;width:100%;margin:0;text-align:left;background:none;border:none;border-radius:6px;
  padding:12px 12px;font-size:.98rem;color:var(--parchment)}
#menu button:hover{background:var(--leather2)}
#menu .sep{height:1px;background:var(--line);margin:4px 8px}
#menu .msg{padding:0 12px 8px;font-size:.8rem}
#menu .msg:empty{display:none;padding:0;min-height:0}
#scrim{position:fixed;inset:0;z-index:7;background:rgba(10,7,5,.35)}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BeerLog</h1>
    <button id="menuBtn" class="quiet hidden" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false"></button>
  </header>

  <section id="home" class="hidden">
    <div class="sign">
      <div class="frame"><div class="panel"><svg viewBox="0 0 44 62" fill="none" stroke="#f1e2c4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20h22l-2.6 36.5A4.6 4.6 0 0 1 25.8 61h-7.6a4.6 4.6 0 0 1-4.6-4.5z"/><path d="M11 20c-1.8-1.6-1.6-4.6.6-5.8-.7-3.4 2.6-6.2 5.8-5 1.4-3.4 6.2-3.6 7.8-.3 3-1.6 6.6.8 6.4 4.2 2.4.9 3 4.2 1.4 6.9"/><path d="M18 28v24M26 28v24" stroke-width="2.2" opacity=".55"/></svg><div class="wm">Beer<em>Log</em></div></div></div>
      <div class="cap">Winnipeg &middot; est. 2026</div>
    </div>
    <div class="ledger">
      <div class="lg"><b id="hCk">&ndash;</b><span>Check-ins</span></div>
      <div class="lg"><b id="hBeers">&ndash;</b><span>Beers</span></div>
      <div class="lg"><b id="hAvg">&ndash;</b><span>Average</span></div>
    </div>
    <div class="shelf">
      <div class="sh"><span class="t">Lately</span><button id="hAll" type="button" class="link">See all</button></div>
      <div id="hCards" class="cards"></div>
    </div>
    <button id="hCheckin" type="button" class="cta">Check in a beer</button>
    <div class="row">
      <button type="button" class="pill" data-go="badges"><span class="chip" id="pcBadge"></span><span class="pl">Badges</span><span class="pn" id="hBadge">&nbsp;</span></button>
      <button type="button" class="pill" data-go="stats"><span class="chip" id="pcStat"></span><span class="pl">Stats</span><span class="pn" id="hYear">&nbsp;</span></button>
      <button type="button" class="pill" data-go="beers"><span class="chip" id="pcBeer"></span><span class="pl">My beers</span><span class="pn" id="hTop">&nbsp;</span></button>
    </div>
  </section>

  <section id="login" class="card hidden">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <main id="app" class="hidden">
    <h2>Log a beer</h2>
    <section class="card">
      <button id="scanBtn" class="scan" type="button">Scan a barcode</button>
      <div id="scanNote" class="meta" style="margin-top:8px"></div>
      <div id="bf"></div>

      <div class="lbl">Served as</div>
      <div id="serving" class="seg"></div>

      <label for="vname">Where</label>
      <input id="vname" autocomplete="off" placeholder="Bar, restaurant, or home">
      <label for="vcity">Where (city)</label>
      <input id="vcity" autocomplete="off">

      <label for="when">When</label>
      <input id="when" type="datetime-local">

      <div class="lbl">Flavours</div>
      <div id="tags" class="chips"></div>
      <input id="flavSearch" autocomplete="off" placeholder="Search for another flavour" style="margin-top:10px">

      <label for="rating">Rating</label>
      <div class="rate">
        <span id="starsOut" class="stars" style="--p:60%">★★★★★</span>
        <span id="ratingNum" class="num">3.00</span>
      </div>
      <input id="rating" type="range" min="0.25" max="5" step="0.25" value="3">

      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional"></textarea>

      <label for="photo">Photo</label>
      <input id="photo" type="file" accept="image/*">
      <div id="photoPrev" class="phprev hidden"><img id="photoImg" alt="Photo to attach"><button id="photoClear" type="button" class="quiet">Remove photo</button></div>

      <button id="saveBtn">Save check-in</button>
      <div id="saveMsg" class="msg"></div>
    </section>

    <h2>Recent check-ins</h2>
    <section class="card" id="recent"></section>

    <h2>Your beers</h2>
    <section class="card" id="beerList"></section>
  </main>

  <section id="detail" class="hidden">
    <button id="backBtn" class="quiet">Back</button>
    <h2 id="dName" style="margin-top:14px"></h2>
    <section class="card">
      <div id="dInfo"></div>
      <div class="avg"><span id="dStars" class="stars" style="--p:0%">★★★★★</span><span id="dAvg" class="big"></span></div>
      <div id="dCount" class="meta"></div>
      <div id="dTags" class="meta" style="margin-top:6px"></div>
      <div class="btnrow"><button id="logAgain">Log another check-in</button><button id="editBtn" class="quiet">Edit details</button></div>
    </section>
    <section id="editBox" class="card hidden" style="margin-top:14px">
      <div id="ebf"></div>
      <div class="btnrow"><button id="editSave">Save changes</button><button id="editCancel" class="quiet">Cancel</button></div>
      <div id="editMsg" class="msg"></div>
    </section>
    <h2>Check-ins</h2>
    <section class="card" id="dList"></section>
  </section>

  <section id="stats" class="hidden">
    <h2 style="margin-top:0">Statistics</h2>
    <div id="stTabs" class="tabs" style="margin-top:0"><button class="tab quiet on" data-st="overview">Overview</button><button class="tab quiet" data-st="top">Top rated</button><button class="tab quiet" data-st="year">Year in review</button></div>
    <div id="stBody"></div>
  </section>

  <section id="badges" class="hidden">
    <h2>Badges</h2>
    <div id="scopeTabs" class="tabs" style="margin-top:0"><button class="tab quiet on" data-scope="all">All time</button><button class="tab quiet" data-scope="since">Since BeerLog</button></div>
    <div id="badgeSummary" class="meta"></div>
    <div id="badgeList"></div>
  </section>

</div>

<div id="scrim" class="hidden"></div>
<div id="menu" class="hidden" role="menu">
  <button id="exportBtn" type="button" role="menuitem">Download backup (CSV)</button>

const $ = id => document.getElementById(id);
let beers = [], stats = {}, venues = {}, signedIn = false, currentBeerId = null, detailFrom = "app";
const meta = { b: {}, e: {} }, seq = { b: 0, e: 0 }, timers = {};

const STYLES = ["IPA","West Coast IPA","Hazy IPA","Double IPA","Session IPA","Pale Ale","American Pale Ale","Amber Ale","Red Ale","Brown Ale","Blonde Ale","Golden Ale","Cream Ale","Kolsch","Pilsner","Czech Pilsner","Lager","Helles","Dunkel","Marzen","Bock","Stout","Imperial Stout","Milk Stout","Porter","Wheat Beer","Hefeweizen","Witbier","Saison","Belgian Tripel","Belgian Dubbel","Belgian Strong Ale","Sour","Gose","Berliner Weisse","Fruited Sour","Barleywine","Scotch Ale","Cider"];
const FAMILIES = ["IPA","Pale Ale","Stout & Porter","Lager","Pilsner","Sour","Wheat","Belgian & Farmhouse","Amber & Red","Brown Ale","Blonde & Golden","Strong Ale","Other"];
const FLAVOURS = ["Hoppy","Citrus","Tropical","Piney","Floral","Malty","Caramel","Roasty","Chocolate","Coffee","Fruity","Sour","Funky","Spicy","Smoky","Bready","Honey","Crisp","Smooth","Bitter","Sweet","Dry","Light","Rich"];

function familyOf(st){
  const s = st.toLowerCase();
  const rules = [[/ipa|india pale/,"IPA"],[/pale ale/,"Pale Ale"],[/stout|porter/,"Stout & Porter"],[/pilsner|pils\b/,"Pilsner"],
    [/sour|gose|berliner|lambic|gueuze|wild ale/,"Sour"],[/wheat|weizen|weiss|witbier|\bwit\b/,"Wheat"],
    [/belgian|saison|tripel|dubbel|quad|farmhouse|biere de garde/,"Belgian & Farmhouse"],
    [/lager|helles|bock|dunkel|m[aä]rzen|vienna|schwarz|kellerbier|zwickel|california common/,"Lager"],
    [/amber|red ale|irish red/,"Amber & Red"],[/brown|\bmild\b/,"Brown Ale"],
    [/blonde|golden|k[oö]lsch|cream ale/,"Blonde & Golden"],[/barley ?wine|strong|scotch ale|wee heavy|old ale/,"Strong Ale"]];
  for (const [re, f] of rules) if (re.test(s)) return f;
  return s ? "Other" : "";
}

function setMsg(el, text, cls){ el.textContent = text; el.className = "msg " + (cls || ""); }
function div(cls, text){ const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }
function nowLocal(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }); }
function avgOf(s){ return s && s.rated ? s.sum / s.rated : null; }
function countText(n){ return n + (n === 1 ? " check-in" : " check-ins"); }
function starsEl(r){
  const s = document.createElement("span");
  s.className = "stars"; s.textContent = "★★★★★";
  s.style.setProperty("--p", (r / 5 * 100) + "%"); s.style.fontSize = "1.15rem";
  s.setAttribute("aria-label", r + " out of 5");
  return s;
}

/* ---------- beer fields (shared by the log form and the edit panel) ---------- */
function bfHTML(p){
  return `
  <label for="${p}name">Beer</label>
  <input id="${p}name" autocomplete="off" placeholder="Beer name">
  <label for="${p}brewery">Brewery</label>
  <input id="${p}brewery" autocomplete="off" placeholder="Type a name to look it up">
  <div id="${p}res" class="res"></div>
  <label for="${p}style">Style</label>
  <input id="${p}style" autocomplete="off" placeholder="e.g. West Coast IPA">
  <details id="${p}more"><summary>More beer details</summary>
    <div class="grid2">
      <div><label for="${p}city">Brewery city</label><input id="${p}city"></div>
      <div><label for="${p}region">Province or state</label><input id="${p}region"></div>
      <div><label for="${p}country">Country</label><input id="${p}country"></div>
      <div><label for="${p}type">Brewery type</label><input id="${p}type" placeholder="e.g. micro"></div>
    </div>
    <label for="${p}web">Brewery website</label>
    <input id="${p}web" inputmode="url">
    <label for="${p}barcode">Barcode</label>
    <input id="${p}barcode" inputmode="numeric" autocomplete="off">
    <label for="${p}fam">Style family</label>
    <select id="${p}fam"><option value="">None</option>${FAMILIES.map(f => `<option>${f}</option>`).join("")}</select>
    <div class="grid2">
      <div><label for="${p}abv">ABV %</label><input id="${p}abv" type="number" step="0.1" min="0" max="70" inputmode="decimal"></div>
      <div><label for="${p}ibu">IBU</label><input id="${p}ibu" type="number" step="1" min="0" max="200" inputmode="numeric"></div>
    </div>
  </details>`;
}

function fillBF(p, b){
  b = b || {};
  const set = (id, v) => { $(p + id).value = v ?? ""; };
  set("name", b.name); set("brewery", b.brewery_name); set("style", b.style); set("city", b.brewery_city);
  set("region", b.brewery_region); set("country", b.brewery_country); set("type", b.brewery_type);
  set("web", b.brewery_website); set("barcode", b.barcode); set("fam", b.style_family); set("abv", b.abv); set("ibu", b.ibu);
  $(p + "fam").dataset.manual = (b.style_family && b.style_family !== familyOf(b.style || "")) ? "1" : "";
  meta[p] = { id: b.open_brewery_db_id, lat: b.brewery_lat, lng: b.brewery_lng };
  $(p + "res").textContent = "";
  if (p === "b") renderFlav();
}

function readBF(p){
  const v = id => $(p + id).value.trim(), m = meta[p] || {};
  const web = v("web"), abv = parseFloat($(p + "abv").value), ibu = parseInt($(p + "ibu").value, 10);
  return {
    name: v("name"), brewery_name: v("brewery") || null, brewery_city: v("city") || null,
    brewery_region: v("region") || null, brewery_country: v("country") || null, brewery_type: v("type") || null,
    brewery_website: web ? (/^https?:\/\//i.test(web) ? web : "https://" + web) : null,
    brewery_lat: m.lat ?? null, brewery_lng: m.lng ?? null, open_brewery_db_id: m.id || null,
    barcode: normBarcode(v("barcode")),
    style: v("style") || null, style_family: $(p + "fam").value || null,
    abv: isNaN(abv) ? null : abv, ibu: isNaN(ibu) ? null : ibu
  };
}

function pickBrewery(p, br){
  const set = (id, v) => { $(p + id).value = v || ""; };
  set("brewery", br.name); set("city", br.city); set("region", br.state_province || br.state);
  set("country", br.country); set("type", br.brewery_type); set("web", br.website_url);
  meta[p] = { id: br.id, lat: parseFloat(br.latitude) || null, lng: parseFloat(br.longitude) || null };
  $(p + "more").open = true;
  const box = $(p + "res"); box.innerHTML = "";
  box.appendChild(div("meta", "Filled from Open Brewery DB. You can edit anything that looks wrong."));
}

function useOwnBrewery(p, b){
  const set = (id, v) => { $(p + id).value = v || ""; };
  set("brewery", b.brewery_name); set("city", b.brewery_city); set("region", b.brewery_region);
  set("country", b.brewery_country); set("type", b.brewery_type); set("web", b.brewery_website);
  meta[p] = { id: b.open_brewery_db_id, lat: b.brewery_lat, lng: b.brewery_lng };
  const box = $(p + "res"); box.innerHTML = "";
  box.appendChild(div("meta", "Filled from your earlier beers."));
}

async function searchBrewery(p){
  const q = $(p + "brewery").value.trim(), box = $(p + "res"), my = ++seq[p];
  box.innerHTML = "";
  if (q.length < 2) return;
  const addBtn = (label, fn) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "pick"; btn.textContent = label;
    btn.addEventListener("click", fn); box.appendChild(btn);
  };
  const ql = q.toLowerCase(), seen = new Set();
  beers.forEach(b => {
    const k = (b.brewery_name || "").toLowerCase();
    if (k && k.includes(ql) && !seen.has(k) && seen.size < 3){
      seen.add(k); addBtn(b.brewery_name + " - from your beers", () => useOwnBrewery(p, b));
    }
  });
  if (q.length < 3) return;
  const note = div("meta", "Searching Open Brewery DB..."); box.appendChild(note);
  try {
    const r = await fetch("https://api.openbrewerydb.org/v1/breweries/search?per_page=5&query=" + encodeURIComponent(q));
    if (!r.ok) throw new Error("status " + r.status);
    const list = await r.json();
    if (my !== seq[p]) return;
    note.remove();
    if (!list.length && !seen.size){ box.appendChild(div("meta", "No match found. You can fill in the details by hand.")); return; }
    list.forEach(br => addBtn(br.name + " - " + [br.city, br.state_province || br.state, br.country].filter(Boolean).join(", "),
      () => pickBrewery(p, br)));
  } catch (e){
    if (my !== seq[p]) return;
    note.textContent = "Brewery lookup isn't available right now. You can type the details by hand.";
  }
}

function wireBF(p){
  $(p + "brewery").addEventListener("input", () => {
    meta[p] = {}; clearTimeout(timers[p]); timers[p] = setTimeout(() => searchBrewery(p), 450);
  });
  $(p + "brewery").addEventListener("change", () => {
    const v = $(p + "brewery").value.trim().toLowerCase();
    const m = beers.find(x => (x.brewery_name || "").toLowerCase() === v && (x.brewery_city || x.brewery_country));
    if (m && !$(p + "city").value && !$(p + "country").value){
      const set = (id, val) => { $(p + id).value = val || ""; };
      set("city", m.brewery_city); set("region", m.brewery_region); set("country", m.brewery_country);
      set("type", m.brewery_type); set("web", m.brewery_website);
      meta[p] = { id: m.open_brewery_db_id, lat: m.brewery_lat, lng: m.brewery_lng };
    }
  });
  $(p + "style").addEventListener("input", () => {
    const f = $(p + "fam"); if (!f.dataset.manual) f.value = familyOf($(p + "style").value);
    if (p === "b") renderFlav();
  });
  $(p + "fam").addEventListener("change", () => { $(p + "fam").dataset.manual = "1"; if (p === "b") renderFlav(); });
}

/* ---------- rating slider and flavour chips ---------- */
function updateRating(){
  const r = parseFloat($("rating").value);
  $("ratingNum").textContent = r.toFixed(2);
  $("starsOut").style.setProperty("--p", (r / 5 * 100) + "%");
}
$("rating").addEventListener("input", updateRating);

function attachSuggest(input, source, onPick, keepFocus){
  const box = document.createElement("div"); box.className = "sug hidden";
  input.insertAdjacentElement("afterend", box);
  function render(){
    const q = input.value.trim().toLowerCase();
    box.innerHTML = "";
    const items = q ? source(q).slice(0, 5) : [];
    if (!items.length){ box.classList.add("hidden"); return; }
    items.forEach(it => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = it.label;
      if (it.sub){ const sm = document.createElement("small"); sm.textContent = it.sub; b.appendChild(sm); }
      b.addEventListener("pointerdown", e => e.preventDefault());
      b.addEventListener("click", () => { onPick(it); box.classList.add("hidden"); if (!keepFocus) input.blur(); });
      box.appendChild(b);
    });
    box.classList.remove("hidden");
  }
  input.addEventListener("input", render);
  input.addEventListener("focus", render);
  input.addEventListener("blur", () => setTimeout(() => box.classList.add("hidden"), 150));
}
function beerMatches(q){

    const n = b.name.toLowerCase(), br = (b.brewery_name || "").toLowerCase(), all = n + " " + br;
    if (!toks.every(t => all.includes(t))) return null;
    return { beer: b, score: n.startsWith(q) ? 0 : n.includes(q) ? 1 : br.includes(q) ? 2 : 3 };
  }).filter(Boolean).sort((a, b) => a.score - b.score || a.beer.name.localeCompare(b.beer.name))
    .map(x => ({ label: x.beer.name, sub: x.beer.brewery_name || "", beer: x.beer }));

const BEERLOG_START = new Date(2026, 10, 13);   // local midnight, 13 Nov 2026: the "Since BeerLog" badges count from here
let badgeScope = "all";
function computeBadges(scope){
  const byId = {}; beers.forEach(b => { byId[b.id] = b; });
  let cks = [...allCk].sort((a, b) => a.checked_in_at < b.checked_in_at ? -1 : a.checked_in_at > b.checked_in_at ? 1 : 0);
  if (scope === "since") cks = cks.filter(c => new Date(c.checked_in_at) >= BEERLOG_START);
  return BADGES.map(bd => {
    const seen = new Set(), dates = [];
    cks.forEach(c => {
      const k = bd.key(c, byId[c.beer_id] || {});
      if (k && !seen.has(k)){ seen.add(k); const i = bd.tiers.indexOf(seen.size); if (i >= 0) dates[i] = c.checked_in_at; }
    });
    const n = seen.size, level = bd.tiers.filter(t => n >= t).length;
    return Object.assign({}, bd, { n, level, dates, next: bd.tiers[level] });
  });
}

}

async function shrink(blob, maxEdge, quality){
  maxEdge = maxEdge || 1600; quality = quality || 0.82;
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(img.naturalWidth * scale)); cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const out = await new Promise(res => cv.toBlob(res, "image/jpeg", quality));
    if (!out) throw new Error("couldn't convert the image");
    return out;
  } finally { URL.revokeObjectURL(url); }
}

    cs.forEach(c => { const b = by[c.beer_id] || {}; lines.push(cols.map(col => csvCell(col[1](c, b))).join(",")); });
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"), d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = "beerlog-backup-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setMsg(msg, "Saved " + cs.length + " check-ins. Photos are not in this file; they stay in your Supabase storage.", "ok");
  } catch (e) {
    setMsg(msg, "Could not make the backup: " + e.message, "err");
  }
  btn.disabled = false;
});

    .select("id, rating, serving_style, venue_name, venue_city, flavour_tags, notes, photo_url, checked_in_at")
    .eq("beer_id", id).order("checked_in_at", { ascending: false });
  if (currentBeerId !== id) return;
  if (c.error){ $("dCount").textContent = "Could not load: " + c.error.message; return; }

  const rows = c.data, rated = rows.filter(r => r.rating != null);
  const avg = rated.length ? rated.reduce((t, r) => t + parseFloat(r.rating), 0) / rated.length : null;
  $("dAvg").textContent = avg != null ? avg.toFixed(2) : "Not rated";
  $("dStars").style.setProperty("--p", (avg != null ? avg / 5 * 100 : 0) + "%");
  $("dCount").textContent = countText(rows.length) + (rows.length
    ? ", first " + fmtDate(rows[rows.length - 1].checked_in_at) + ", latest " + fmtDate(rows[0].checked_in_at) : "");

  const tally = {};
  rows.forEach(r => (r.flavour_tags || []).forEach(t => { tally[t] = (tally[t] || 0) + 1; }));
  const top = Object.entries(tally).sort((x, y) => y[1] - x[1]).slice(0, 8);
  if (top.length) $("dTags").textContent = "Flavours you've noted: " + top.map(([t, n]) => t + " (" + n + ")").join(", ");

  const photoUrls = {};
  const paths = rows.map(r => r.photo_url).filter(Boolean);
  if (paths.length){
    const su = await db.storage.from("photos").createSignedUrls(paths, 3600);
    if (!su.error) (su.data || []).forEach(x => { if (x.signedUrl && x.path) photoUrls[x.path] = x.signedUrl; });
    if (currentBeerId !== id) return;
  }

  if (!rows.length) $("dList").appendChild(div("empty", "No check-ins for this beer."));
  rows.forEach(ci => {
    const row = div("entry"), head = div("top");
    head.appendChild(div("name", fmtDate(ci.checked_in_at) + ", " + fmtTime(ci.checked_in_at)));
    if (ci.rating != null) head.appendChild(starsEl(parseFloat(ci.rating)));
    row.appendChild(head);

      [ci.venue_name, ci.venue_city].filter(Boolean).join(", "),

    if (ci.flavour_tags && ci.flavour_tags.length) row.appendChild(div("sub", ci.flavour_tags.join(", ")));
    if (ci.notes) row.appendChild(div("note", ci.notes));

      const im = document.createElement("img"); im.className = "ph"; im.loading = "lazy"; im.alt = "Photo from this check-in";
      im.src = photoUrls[ci.photo_url]; im.addEventListener("click", () => openPhoto(im.src)); row.appendChild(im);
    }
    const del = document.createElement("button");
    del.className = "quiet"; del.textContent = "Delete"; del.style.marginTop = "6px";
    del.addEventListener("click", async () => {
      if (!confirm("Delete this check-in?")) return;
      const r = await db.from("checkins").delete().eq("id", ci.id);
      if (r.error){ alert("Could not delete: " + r.error.message); return; }
      if (ci.photo_url) await db.storage.from("photos").remove([ci.photo_url]);
      const from = detailFrom; await load(); openBeer(id, from);
    });
    row.appendChild(del);
    $("dList").appendChild(row);
  });
}

/* ---------- barcode scanning and Open Food Facts lookup ---------- */
function normBarcode(x){
  const d = String(x || "").replace(/\D/g, "");
  if (!d) return null;
  return d.length < 13 ? d.padStart(13, "0") : d;
}
let scanner = null, torch = null, torchOn = false, handling = false;

async function openScanner(){
  pushState({ view: "overlay" });
  $("scanner").classList.remove("hidden"); $("manualCode").value = "";
  setMsg($("scanStatus"), "Starting camera...");
  if (typeof Html5Qrcode === "undefined"){
    setMsg($("scanStatus"), "The scanner library didn't load. Check your connection, or type the barcode below.", "err"); return;
  }
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E],
      useBarCodeDetectorIfSupported: true, verbose: false
    });
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 140 } },
      code => onCode(code), () => {});
    setMsg($("scanStatus"), "Centre the barcode in the frame.");
    try {
      const t = scanner.getRunningTrackCameraCapabilities().torchFeature();
      if (t.isSupported()){ torch = t; torchOn = false; $("torchBtn").classList.remove("hidden"); }
    } catch (e){}
  } catch (e){
    setMsg($("scanStatus"), "Couldn't start the camera (" + (e && e.message ? e.message : e) + "). Allow camera access, or type the barcode below.", "err");
  }
}
async function closeScanner(){
  try { if (scanner && scanner.isScanning) await scanner.stop(); if (scanner) scanner.clear(); } catch (e){}
  scanner = null; torch = null;
  $("scanner").classList.add("hidden"); $("torchBtn").classList.add("hidden");
}
async function onCode(code){
  if (handling) return;
  handling = true;
  if (navigator.vibrate) navigator.vibrate(80);
  back();
  await closeScanner();
  await lookupBarcode(code);
  handling = false;
}

function scanNote(text, code){
  const box = $("scanNote"); box.textContent = text;
  if (code){
    box.appendChild(document.createTextNode(" "));
    const a = document.createElement("a");
    a.href = "https://world.openfoodfacts.org/product/" + code; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Open Food Facts page"; box.appendChild(a);
  }
}

async function lookupBarcode(raw){
  const code = normBarcode(raw);
  if (!code){ scanNote("That doesn't look like a barcode number."); return; }
  fillBF("b"); $("bbarcode").value = code;
  const mine = beers.find(x => x.barcode === code);
  if (mine){ fillBF("b", mine); scanNote("Found in your beers. Check the details, then save your check-in."); return; }
  scanNote("Looking up " + code + " in Open Food Facts...");
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code +
      ".json?fields=product_name,brands,quantity,categories_tags,nutriments,packaging_tags");
    const data = (r.ok || r.status === 404) ? await r.json().catch(() => null) : null;
    if (!r.ok && r.status !== 404) throw new Error("status " + r.status);
    if (!data || !data.product || data.status === 0){
      scanNote("Not in Open Food Facts yet. Fill in the beer's details by hand. The barcode will be saved, so next time it's instant.");
      $("bname").focus(); return;
    }
    applyOFF(code, data.product);
  } catch (e){
    scanNote("Couldn't reach Open Food Facts. Fill in the details by hand. The barcode will still be saved.");
  }
}

function applyOFF(code, p){
  const tags = p.categories_tags || [];
  const beerish = tags.some(t => /beer|ale|lager|stout|porter|pilsner|ipa|cider|alcohol/.test(t));
  const brand = (p.brands || "").split(",")[0].trim();
  $("bname").value = p.product_name || "";
  $("bbrewery").value = brand;

  const generic = /^en:(beers?|alcoholic-beverages|beverages|beers-with-alcohol|fermented-beverages|fermented-drinks|alcoholic-drinks|craft-beers)$/;
  const cands = tags.filter(t => t.startsWith("en:") && !generic.test(t) &&
    /beer|ale|lager|stout|porter|pilsner|ipa|wheat|sour|weiss|saison|bock|helles|gose|kolsch|bitter/.test(t));
  if (cands.length){
    const st = cands[cands.length - 1].slice(3).replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    $("bstyle").value = st; $("bfam").value = familyOf(st);
  }
  const n = p.nutriments || {}, abv = parseFloat(n.alcohol_100g ?? n.alcohol ?? n.alcohol_value);
  if (abv > 0 && abv <= 70) $("babv").value = abv;

  let ml = 0;   // only used to tell a can from a king can or crowler; never saved
  const q = /(\d+(?:[.,]\d+)?)\s*(ml|cl|l)\b/i.exec(p.quantity || "");
  if (q){
    const v = parseFloat(q[1].replace(",", ".")), u = q[2].toLowerCase();
    ml = Math.round(u === "l" ? v * 1000 : u === "cl" ? v * 10 : v);
  }
  const pk = p.packaging_tags || [];
  if (pk.some(t => /(^|[:-])can($|-)/.test(t))) setServing(ml >= 900 ? "Crowler" : ml >= 440 ? "King Can" : "Can");
  else if (pk.some(t => /bottle/.test(t))) setServing("Bottle");

  $("bmore").open = true;
  scanNote((beerish ? "Filled from Open Food Facts. Check everything below." :
    "Found in Open Food Facts, but it doesn't look like a beer. Check everything below.") , code);
  renderFlav();
  if (brand) searchBrewery("b");
}

$("scanBtn").addEventListener("click", openScanner);
$("scanClose").addEventListener("click", () => back());
$("manualGo").addEventListener("click", () => { const v = $("manualCode").value; if (v.trim()) onCode(v); });
$("manualCode").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("manualGo").click(); } });
$("torchBtn").addEventListener("click", async () => {
  if (!torch) return;
  try { torchOn = !torchOn; await torch.apply(torchOn); } catch (e){ torchOn = !torchOn; }
});

$("scopeTabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  badgeScope = t.dataset.scope; renderBadges();
});
$("nav").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  const v = t.dataset.view;
  if (v === "app") goApp(); else if (v === "home") goHome(); else goView(v);
});

db.auth.getSession().then(({ data }) => show(data.session));
db.auth.onAuthStateChange((_evt, session) => show(session));
</script>
